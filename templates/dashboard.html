<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel</title><body><h1>Agente Comercial</h1><a href="/admin/logout">Sair</a><h2>Nova empresa</h2><form method="post" action="/admin/company"><input name="name" placeholder="Empresa" required><input name="slug" placeholder="slug" required><input name="agent_name" placeholder="Nome do agente"><textarea name="presentation" placeholder="Apresentação"></textarea><textarea name="description" placeholder="Descrição"></textarea><input name="instagram" placeholder="Instagram"><input name="whatsapp" placeholder="WhatsApp"><input name="phone" placeholder="Telefone"><input name="email" placeholder="E-mail"><button>Criar</button></form><h2>Empresas</h2>{% for c in companies %}<hr><h3>{{c.name}}</h3><p>Chat: <a href="/c/{{c.slug}}">/c/{{c.slug}}</a></p><form method="post" enctype="multipart/form-data" action="/admin/company/{{c.id}}/knowledge"><input type="file" name="file"><button>Adicionar conhecimento</button></form>{% endfor %}</body></html>
