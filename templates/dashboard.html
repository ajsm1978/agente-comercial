<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel - Agente Comercial</title>
</head>
<body>
<h1>Agente Comercial</h1>
<p><a href="/admin/logout">Sair</a></p>
<h2>Nova empresa</h2>
<form method="POST" action="/admin/company">
<input name="name" placeholder="Empresa" required>
<input name="slug" placeholder="slug" required>
<input name="agent_name" placeholder="Nome do agente">
<textarea name="presentation" placeholder="Apresentação"></textarea>
<textarea name="description" placeholder="Descrição"></textarea>
<input name="instagram" placeholder="Instagram">
<input name="whatsapp" placeholder="WhatsApp">
<input name="phone" placeholder="Telefone">
<input name="email" placeholder="E-mail">
<button type="submit">Criar empresa</button>
</form>
<h2>Empresas</h2>
{% for c in companies %}
<hr>
<h3>{{c.name}}</h3>
<p>Chat: <a href="/c/{{c.slug}}">/c/{{c.slug}}</a></p>
<form method="POST" enctype="multipart/form-data" action="/admin/company/{{c.id}}/knowledge">
<input type="file" name="file" accept=".txt,.md,.csv">
<button type="submit">Adicionar conhecimento</button>
</form>
{% else %}
<p>Nenhuma empresa cadastrada ainda.</p>
{% endfor %}
</body>
</html>
