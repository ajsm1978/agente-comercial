<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar — {{company.name}}</title><style>body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px}.card{background:#fff;padding:20px;border-radius:16px}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;font-size:16px;border-radius:9px}input,textarea{border:1px solid #ccd3da}textarea{min-height:110px}button{border:0;background:#111;color:#fff}a{color:#1261a0}</style></head><body><div class="wrap"><div class="card"><h1>Editar empresa</h1><form method="post"><label>Empresa</label><input name="name" value="{{company.name}}" required><label>Slug</label><input name="slug" value="{{company.slug}}" required><label>Nome do agente</label><input name="agent_name" value="{{company.agent_name}}"><label>Apresentação</label><textarea name="presentation">{{company.presentation}}</textarea><label>Descrição</label><textarea name="description">{{company.description}}</textarea><label>Instagram</label><input name="instagram" value="{{company.instagram}}"><label>WhatsApp</label><input name="whatsapp" value="{{company.whatsapp}}"><label>Telefone</label><input name="phone" value="{{company.phone}}"><label>E-mail</label><input name="email" value="{{company.email}}"><button>Salvar</button></form><a href="/admin">Voltar ao painel</a></div></div></body></html>
