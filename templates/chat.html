<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{company.name}}</title><style>body{margin:0;background:#eef2f5;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.top{background:#111;color:#fff;padding:20px}.top h1{margin:0 0 5px;font-size:21px}.top p{margin:0;opacity:.85}.chat{flex:1;padding:16px}.bubble{padding:11px 14px;border-radius:14px;margin:9px 0;max-width:85%;white-space:pre-wrap}.me{background:#dceeff;margin-left:auto}.bot{background:#fff}.composer{position:sticky;bottom:0;background:#fff;padding:10px;display:flex;gap:8px;border-top:1px solid #ddd}.composer input{flex:1;padding:13px;border:1px solid #ccd3da;border-radius:10px;font-size:16px}.composer button{padding:0 18px;border:0;border-radius:10px;background:#111;color:#fff}</style></head><body><div class="wrap"><div class="top"><h1>{{company.agent_name}}</h1><p>{{company.name}}</p></div><div id="chat" class="chat"><div class="bubble bot">{{company.presentation}}</div></div><form class="composer" onsubmit="send(event)"><input id="msg" autocomplete="off" placeholder="Digite sua mensagem..." required><button>Enviar</button></form></div><script>async function send(e){e.preventDefault();const input=document.getElementById('msg'),box=document.getElementById('chat'),m=input.value.trim();if(!m)return;box.innerHTML+='<div class="bubble me">'+escapeHtml(m)+'</div>';input.value='';const r=await fetch('/api/chat/{{company.slug}}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});const d=await r.json();box.innerHTML+='<div class="bubble bot">'+escapeHtml(d.reply||'Não consegui responder agora.')+'</div>';window.scrollTo(0,document.body.scrollHeight)}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</script></body></html>
