<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{company.name}}</title><body><h2>{{company.agent_name}}</h2><p>{{company.presentation}}</p><div id="chat"></div><input id="msg" placeholder="Digite sua mensagem"><button onclick="send()">Enviar</button><script>const h=[];async function send(){let x=document.getElementById('msg'),m=x.value.trim();if(!m)return;h.push({role:'user',content:m});document.getElementById('chat').innerHTML+='<p><b>Você:</b> '+m+'</p>';x.value='';let r=await fetch('/api/chat/{{company.slug}}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,history:h})});let d=await r.json();h.push({role:'assistant',content:d.reply});document.getElementById('chat').innerHTML+='<p><b>{{company.agent_name}}:</b> '+d.reply+'</p>'}</script></body></html>
