<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agente Comercial — Login</title><style>body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,90vw);background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:12px;font-size:16px;border-radius:10px}input{border:1px solid #ccd3da}button{border:0;background:#111;color:white}.err{color:#b00020;margin-top:12px}</style></head><body><div class="card"><h1>Agente Comercial</h1><p>Painel administrativo</p><form method="post"><input type="password" name="password" placeholder="Senha" autocomplete="current-password" required><button>Entrar</button></form>{% if error %}<p class="err">{{error}}</p>{% endif %}</div></body></html>
